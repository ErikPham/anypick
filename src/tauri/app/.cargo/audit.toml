# Recorded supply-chain decisions for `cargo audit` (release gate).
#
# Everything ignored below is a WARNING, not a vulnerability: `cargo audit`
# still fails the build on any real RUSTSEC vulnerability. Each entry is
# transitive via Tauri 2's Linux system-tray stack (tao/wry -> gtk 0.18) or
# the unic 0.9 chain behind it, with no upgrade path inside Tauri 2.
# Re-evaluate on a Tauri major bump; do not extend this list for direct
# dependencies — upgrade those instead.
[advisories]
ignore = [
    # gtk-rs GTK3 bindings, unmaintained (tauri tray stack, Linux only).
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # Unsound glib::VariantStrIter impls (same stack). No safe iterator use
    # in our code; the bindings only cross FFI for tray/menu text.
    "RUSTSEC-2024-0429",
    # proc-macro-error, unmaintained (transitive macro helper).
    "RUSTSEC-2024-0370",
    # unic 0.9 chain, unmaintained (transitive via gtk stack).
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

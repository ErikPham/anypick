name: Release

# A release is: plan the version, stage every in-scope artifact, verify and
# sign them, and only then commit the version, push the tag, and publish the
# GitHub Release (ADR 0020). Nothing public moves before all green.
#
# GitHub Releases are the canonical source. The same run also prepares package
# manager metadata for Homebrew, WinGet and Scoop, and can publish the thin npm
# adapter through npm trusted publishing when that channel is enabled.
#
# release-scope=all (the default) publishes the signed macOS app, the staged
# Tauri Linux/Windows installers and the cross-platform CLI archives. Each
# desktop payload is smoke-tested on its own OS before staging: the Linux deb/
# AppImage/rpm and the Windows MSI are extracted, and the bundled Go helper must
# answer with the planned version. The GUI itself is not launched (no display on
# a hosted runner), so this is an installer-payload gate, not a UI test.
# release-scope=macos-only narrows a release to macOS plus the CLI archives.
on:
  workflow_dispatch:
    inputs:
      release-scope:
        description: "Desktop platforms to publish"
        required: false
        default: "all"
        type: choice
        options: [macos-only, all]
      publish-npm:
        description: "Publish the thin npm launcher (requires npm trusted publishing)"
        required: false
        default: false
        type: boolean
      publish-homebrew:
        description: "Update the configured external Homebrew tap"
        required: false
        default: false
        type: boolean
      publish-scoop:
        description: "Update the configured external Scoop bucket"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a clean main checkout
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git status --porcelain)"

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      # anypick-release plan reads Conventional Commits since the current tag
      # and prints mode/bump/version/tag. "none" stops the run before anything
      # external changes; "resume" reuses an existing tag so a rerun after a
      # partial failure does not invent a second version.
      - name: Plan version from Conventional Commits
        id: plan
        run: cd src/go && go run ./cmd/anypick-release plan | tee "$GITHUB_OUTPUT"

      - name: Stop when there is nothing to release
        if: steps.plan.outputs.mode == 'none'
        run: |
          echo "::notice::No feat, fix or perf commit since ${{ steps.plan.outputs.tag }}; nothing to release."
          exit 0

      - name: Record the staged SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" | tee "$GITHUB_OUTPUT"

  build-cli:
    name: Build the cross-platform CLI archives
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - name: Apply the planned version (staged, not pushed)
        run: cd src/go && go run ./cmd/anypick-release set "${{ needs.plan.outputs.version }}"

      - name: Verify release version sources
        run: make check-release

      - name: Build and archive every supported CLI target
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/anypick-cli"
          work="$RUNNER_TEMP/anypick-cli-work"
          mkdir -p "$stage" "$work"
          for target in \
            darwin-amd64 darwin-arm64 \
            linux-amd64 linux-arm64 \
            windows-amd64 windows-arm64; do
            goos="${target%-*}"
            goarch="${target#*-}"
            executable="anypick"
            archive="anypick-${RELEASE_VERSION}-${target}"
            if [[ "$goos" == windows ]]; then
              executable="anypick.exe"
              archive="$archive.zip"
            else
              archive="$archive.tar.gz"
            fi
            rm -f "$work/anypick" "$work/anypick.exe"
            (
              cd src/go
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags "-s -w -X github.com/outof0/anypick/go/internal/buildinfo.Version=${RELEASE_VERSION}" \
                -o "$work/$executable" ./cmd/anypick
            )
            if [[ "$goos" == windows ]]; then
              (cd "$work" && zip -q "$stage/$archive" "$executable")
            else
              tar -C "$work" -czf "$stage/$archive" "$executable"
            fi
          done
          test "$(find "$stage" -maxdepth 1 -type f | wc -l)" -eq 6

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anypick-cli
          path: ${{ runner.temp }}/anypick-cli
          if-no-files-found: error

  build-linux:
    name: Verify and stage the Linux app
    needs: plan
    if: needs.plan.outputs.mode != 'none' && inputs.release-scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Select stable Rust with rustfmt
        run: |
          rustup default stable
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/tauri/app -> src/tauri/app/target
          shared-key: anypick-tauri-release
          cache-on-failure: true

      - name: Apply the planned version (staged, not pushed)
        run: cd src/go && go run ./cmd/anypick-release set "${{ needs.plan.outputs.version }}"

      - name: Reject unexpected version edits
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(VERSION|npm/anypick/package.json|src/tauri/app/(Cargo.toml|Cargo.lock|tauri.conf.json)|src/macos/AnyPick.xcodeproj/project.pbxproj)$' || true)"
          test -z "$unexpected" || { echo "Unexpected release edits:"; echo "$unexpected"; exit 1; }

      # ── verification gate: nothing is staged until this is green ──
      - name: Cross-language check
        run: make check

      - name: Go vet and test
        run: |
          make vet
          make test

      - name: Tauri UI typecheck and bundle build
        run: |
          cd src/tauri/ui && npm ci
          make typecheck-tauri-ui
          # The Rust bin embeds frontendDist (../frontend) at compile time, so
          # the bundle must exist before cargo check/test/clippy/build run.
          make build-tauri-ui

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Tauri cargo fmt, test, lints and audit
        run: |
          cargo fmt --manifest-path src/tauri/app/Cargo.toml -- --check
          cargo test --locked --manifest-path src/tauri/app/Cargo.toml
          cargo clippy --locked --manifest-path src/tauri/app/Cargo.toml -- -D warnings
          cargo install cargo-audit --version 0.22.2 --locked
          cd src/tauri/app && cargo audit

      - name: Build the Linux desktop app
        run: make build-tauri

      - name: Stage the Linux bundles
        run: |
          shopt -s nullglob
          assets=(src/tauri/app/target/release/bundle/appimage/*.AppImage
                  src/tauri/app/target/release/bundle/deb/*.deb
                  src/tauri/app/target/release/bundle/rpm/*.rpm)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::the Linux desktop app produced no bundle"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/anypick-stage"
          cp "${assets[@]}" "$RUNNER_TEMP/anypick-stage/"

      - name: Smoke-test the staged installer payloads
        run: packaging/smoke/linux-payload.sh "$RUNNER_TEMP/anypick-stage" "${{ needs.plan.outputs.version }}"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anypick-linux
          path: ${{ runner.temp }}/anypick-stage
          if-no-files-found: error

  build-windows:
    name: Verify and stage the Windows app
    needs: plan
    if: needs.plan.outputs.mode != 'none' && inputs.release-scope == 'all'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - name: Select stable Rust with rustfmt
        run: |
          rustup default stable
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/tauri/app -> src/tauri/app/target
          shared-key: anypick-tauri-release-windows
          cache-on-failure: true

      - name: Apply the planned version (staged, not pushed)
        run: cd src/go && go run ./cmd/anypick-release set "${{ needs.plan.outputs.version }}"

      - name: Reject unexpected version edits
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(VERSION|npm/anypick/package.json|src/tauri/app/(Cargo.toml|Cargo.lock|tauri.conf.json)|src/macos/AnyPick.xcodeproj/project.pbxproj)$' || true)"
          test -z "$unexpected" || { echo "Unexpected release edits:"; echo "$unexpected"; exit 1; }

      - name: Cross-language check
        run: make check

      - name: Tauri UI typecheck and bundle build
        run: |
          cd src/tauri/ui && npm ci
          make typecheck-tauri-ui
          # The Rust bin embeds frontendDist (../frontend) at compile time, so
          # the bundle must exist before cargo test/clippy/build run.
          make build-tauri-ui

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Tauri cargo fmt, test, lints and audit
        run: |
          cargo fmt --manifest-path src/tauri/app/Cargo.toml -- --check
          cargo test --locked --manifest-path src/tauri/app/Cargo.toml
          cargo clippy --locked --manifest-path src/tauri/app/Cargo.toml -- -D warnings
          cargo install cargo-audit --version 0.22.2 --locked
          cd src/tauri/app && cargo audit

      - name: Build the Windows desktop app
        run: make build-tauri

      - name: Stage the Windows installers
        run: |
          shopt -s nullglob
          msi_assets=(src/tauri/app/target/release/bundle/msi/*.msi)
          nsis_assets=(src/tauri/app/target/release/bundle/nsis/*.exe)
          assets=("${msi_assets[@]}" "${nsis_assets[@]}")
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::the Windows desktop app produced no bundle"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/anypick-stage"
          cp "${assets[@]}" "$RUNNER_TEMP/anypick-stage/"
          if [ "${#msi_assets[@]}" -eq 0 ]; then
            echo "::error::the Windows desktop app produced no MSI for WinGet"
            exit 1
          fi
          cp "${msi_assets[0]}" "$RUNNER_TEMP/anypick-stage/AnyPick-${{ needs.plan.outputs.version }}-windows-x64.msi"

      - name: Smoke-test the staged installer payloads
        shell: pwsh
        run: packaging/smoke/windows-payload.ps1 -Stage "${{ runner.temp }}/anypick-stage" -Version "${{ needs.plan.outputs.version }}"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anypick-windows
          path: ${{ runner.temp }}/anypick-stage
          if-no-files-found: error

  build-macos:
    name: Sign, notarize and stage the macOS app
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - name: Apply the planned version (staged, not pushed)
        run: cd src/go && go run ./cmd/anypick-release set "${{ needs.plan.outputs.version }}"

      # ADR 0020: a public macOS artifact is Developer ID signed, notarized
      # and stapled. An unsigned build must never reach the Release — fail
      # here with the fix instead of shipping CODE_SIGNING_ALLOWED=NO.
      - name: Require macOS signing material
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for v in APPLE_DEVELOPER_ID_APPLICATION APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!v:-}" ]; then echo "::error::$v is not configured."; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::macOS signing/notarization secrets are required for a public release (ADR 0020). Configure them, or narrow the release scope — do not ship unsigned."
            exit 1
          fi

      # codesign finds the Developer ID identity only after the certificate
      # and private key are imported into a keychain on this runner.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/anypick-signing.keychain-db"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/anypick-cert.p12"
          security create-keychain -p "$APPLE_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_CERT_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/anypick-cert.p12" -k "$keychain" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '" ')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERT_PASSWORD" "$keychain"
          rm "$RUNNER_TEMP/anypick-cert.p12"

      - name: Build, sign, notarize and staple the universal app
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          src/macos/scripts/release-sign-notarize.sh \
            --version "${{ needs.plan.outputs.version }}"

      - name: Verify the bundle has no Node runtime (ADR 0020)
        run: |
          app="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release/AnyPick.app' -print -quit)"
          test -n "$app"
          test -x "$app/Contents/Helpers/anypick-core"
          src/macos/scripts/check-node-free-app.sh "$app"
          GOPATH="${HOME}/go" GOTOOLCHAIN=auto go run ./src/go/cmd/anypick-artifact node-free "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/AnyPick-macos-universal.zip"
          hdiutil create -volname AnyPick -srcfolder "$app" -ov -format UDZO \
            "$RUNNER_TEMP/AnyPick-macos-universal.dmg"

      - name: Smoke-test the signed artifact on a clean account
        run: |
          app="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release/AnyPick.app' -print -quit)"
          src/macos/scripts/smoke-installed-artifact.sh "$app" "${{ needs.plan.outputs.version }}"
          src/macos/scripts/smoke-app-service.sh "$app"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anypick-macos
          path: |
            ${{ runner.temp }}/AnyPick-macos-universal.zip
            ${{ runner.temp }}/AnyPick-macos-universal.dmg
          if-no-files-found: error

  publish:
    name: Tag, release and deploy
    needs: [plan, build-cli, build-linux, build-windows, build-macos]
    # Skipped platform builds (out-of-scope inputs) do not block: only the
    # in-scope builds must be green. The CLI archives are always built because
    # they power npm and Homebrew even when a desktop scope is narrowed.
    if: always() && needs.plan.outputs.mode != 'none' && needs.build-cli.result == 'success' && needs.build-macos.result == 'success' && (inputs.release-scope != 'all' || (needs.build-linux.result == 'success' && needs.build-windows.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://anypick.dev
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.0

      - name: Validate release infrastructure
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$REPOSITORY_VISIBILITY" = public || {
            echo 'The repository must be public to publish a public release.'
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured.'
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo 'CLOUDFLARE_API_TOKEN is not configured.'
            exit 1
          }
          cd docs && pnpm install --frozen-lockfile && pnpm exec wrangler whoami

      - name: Validate requested package-manager scope
        if: (inputs.publish-scoop || vars.SCOOP_PUBLISH_ENABLED == 'true') && inputs.release-scope != 'all'
        run: |
          echo "::error::Scoop publishing requires release-scope=all so the Windows CLI and MSI are present."
          exit 1

      - name: Apply the planned version
        run: cd src/go && go run ./cmd/anypick-release set "${{ needs.plan.outputs.version }}"

      - name: Reject unexpected version edits
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(VERSION|npm/anypick/package.json|src/tauri/app/(Cargo.toml|Cargo.lock|tauri.conf.json)|src/macos/AnyPick.xcodeproj/project.pbxproj)$' || true)"
          test -z "$unexpected" || { echo "Unexpected release edits:"; echo "$unexpected"; exit 1; }

      - name: Docs typecheck, lint and build
        working-directory: docs
        run: |
          pnpm typecheck
          pnpm lint:docs
          pnpm build
          pnpm exec wrangler types "${RUNNER_TEMP}/anypick-pages-env.d.ts"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anypick-cli
          path: ${{ runner.temp }}/anypick-stage

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.build-linux.result == 'success'
        with:
          name: anypick-linux
          path: ${{ runner.temp }}/anypick-stage

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.build-windows.result == 'success'
        with:
          name: anypick-windows
          path: ${{ runner.temp }}/anypick-stage

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anypick-macos
          path: ${{ runner.temp }}/anypick-stage

      - name: Render package-manager metadata
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/anypick-stage"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          (cd "$stage" && sha256sum -- *) > "$RUNNER_TEMP/anypick-input-sums.txt"
          mkdir -p "$RUNNER_TEMP/package-manifests/winget" "$RUNNER_TEMP/package-manifests/scoop"
          if [[ -f "$stage/AnyPick-${RELEASE_VERSION}-windows-x64.msi" ]]; then
            bash packaging/winget/render.sh "$RELEASE_VERSION" "$base" \
              "$RUNNER_TEMP/anypick-input-sums.txt" "$RUNNER_TEMP/package-manifests/winget"
            bash packaging/scoop/render.sh "$RELEASE_VERSION" "$base" \
              "$RUNNER_TEMP/anypick-input-sums.txt" "$RUNNER_TEMP/package-manifests/scoop"
          else
            echo "Windows desktop scope is disabled; skipping WinGet and Scoop manifests."
          fi
          find "$RUNNER_TEMP/package-manifests" -type f -print -quit | grep -q . && \
            (cd "$RUNNER_TEMP/package-manifests" && zip -qr "$stage/AnyPick-package-manager-manifests.zip" .) || true

      # Every in-scope platform is staged and green at this point (macOS
      # always; Linux/Windows only under release-scope=all). Only now does
      # anything public move: version commit, tag, Release, assets.
      - name: Commit version and push tag
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version_files=(
            VERSION
            npm/anypick/package.json
            src/tauri/app/Cargo.toml
            src/tauri/app/Cargo.lock
            src/tauri/app/tauri.conf.json
            src/macos/AnyPick.xcodeproj/project.pbxproj
          )
          if ! git diff --quiet -- "${version_files[@]}"; then
            git add "${version_files[@]}"
            git diff --cached --check
            git commit -m "chore(release): ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "${RELEASE_TAG} already exists; reusing it."
          else
            git tag --annotate "$RELEASE_TAG" --message "AnyPick ${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      # changelogithub is fetched on demand rather than added to docs/, because
      # a new devDependency also needs a lockfile update and this tool runs once
      # per release.
      - name: Create or update the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          npx --yes changelogithub@14.0.0 --github "$GITHUB_REPOSITORY" --to "$RELEASE_TAG"

      - name: Attach staged artifacts with checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/anypick-stage/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no staged artifacts to publish"
            exit 1
          fi
          (cd "$RUNNER_TEMP/anypick-stage" && sha256sum -- *) > "$RUNNER_TEMP/anypick-stage/SHA256SUMS.txt"
          gh release upload "$RELEASE_TAG" "${assets[@]}" "$RUNNER_TEMP/anypick-stage/SHA256SUMS.txt" --clobber

      # npm's trusted publisher uses GitHub's OIDC identity; no long-lived
      # npm token is stored in the repository. The package is only the thin
      # launcher in npm/anypick — native bundles remain Node-free.
      - name: Publish the npm launcher
        if: inputs.publish-npm || vars.NPM_PUBLISH_ENABLED == 'true'
        run: |
          npm install --global npm@11.5.1
          npm --version
          npm publish --access public --provenance
        working-directory: npm/anypick

      - name: Publish the Homebrew tap
        if: inputs.publish-homebrew || vars.HOMEBREW_PUBLISH_ENABLED == 'true'
        env:
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          packaging/homebrew/publish.sh "$RELEASE_VERSION" "$base" \
            "$RUNNER_TEMP/anypick-stage/SHA256SUMS.txt"

      - name: Publish the Scoop bucket
        if: (inputs.publish-scoop || vars.SCOOP_PUBLISH_ENABLED == 'true') && inputs.release-scope == 'all'
        env:
          SCOOP_BUCKET_REPOSITORY: ${{ vars.SCOOP_BUCKET_REPOSITORY }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          packaging/scoop/publish.sh "$RELEASE_VERSION" "$base" \
            "$RUNNER_TEMP/anypick-stage/SHA256SUMS.txt"

      - name: Generate the release SBOM
        uses: anchore/sbom-action@aa0e114b2e19480f157109b9922bda359bd98b90 # v0.20.8
        with:
          path: ${{ runner.temp }}/anypick-stage
          format: spdx-json
          output-file: ${{ runner.temp }}/anypick-stage/anypick-sbom.spdx.json

      - name: Attach the SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/anypick-stage/anypick-sbom.spdx.json" --clobber

      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/anypick-stage/*

      - name: Deploy the docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cd docs && pnpm run deploy

name: Release

# A release is: verify everything on Linux, commit and push the version, build
# the Linux/Windows (Tauri) and macOS apps, deploy the docs, and create or
# update the GitHub Release. There is no npm package — the JavaScript toolchain
# was removed in e59509d and ADR-0020 makes npm optional, so the only channels
# are the GitHub Release and the docs site.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, version and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://anypick.dev
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a clean main checkout
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git status --porcelain)"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c5ad0272d90 # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.1'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Select stable Rust with rustfmt
        run: |
          rustup default stable
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/tauri/src-tauri -> src/tauri/src-tauri/target
          shared-key: anypick-tauri-release
          cache-on-failure: true

      - name: Validate release infrastructure
        env:
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$REPOSITORY_VISIBILITY" = public || {
            echo 'The repository must be public to publish a public release.'
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured.'
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo 'CLOUDFLARE_API_TOKEN is not configured.'
            exit 1
          }
          cd docs && pnpm install --frozen-lockfile && pnpm exec wrangler whoami

      # anypick-release plan replaces scripts/release-plan.mjs, deleted with the
      # JavaScript toolchain. It reads Conventional Commits since the current
      # tag and prints mode/bump/version/tag. "none" stops the run before
      # anything external changes; "resume" reuses an existing tag so a rerun
      # after a partial failure does not invent a second version.
      - name: Plan version from Conventional Commits
        id: plan
        run: cd src/go && go run ./cmd/anypick-release plan | tee "$GITHUB_OUTPUT"

      - name: Stop when there is nothing to release
        if: steps.plan.outputs.mode == 'none'
        run: |
          echo "::notice::No feat, fix or perf commit since ${{ steps.plan.outputs.tag }}; nothing to release."
          exit 0

      - name: Apply the planned version
        if: steps.plan.outputs.mode == 'release'
        run: cd src/go && go run ./cmd/anypick-release set "${{ steps.plan.outputs.version }}"

      - name: Reject unexpected version edits
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(VERSION|src/tauri/src-tauri/(Cargo.toml|Cargo.lock|tauri.conf.json)|src/macos/AnyPick.xcodeproj/project.pbxproj)$' || true)"
          test -z "$unexpected" || { echo "Unexpected release edits:"; echo "$unexpected"; exit 1; }

      # ── verification gate: nothing external changes below this line ──────
      - name: Cross-language gates
        run: make gates

      - name: Go vet and test
        run: |
          make vet
          make test

      - name: Tauri UI typecheck and build
        run: |
          cd src/tauri/ui && npm ci
          make tauri-check

      - name: Tauri cargo check, fmt and test
        run: |
          cargo fmt --manifest-path src/tauri/src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src/tauri/src-tauri/Cargo.toml

      - name: Build the Linux desktop app
        run: make tauri-build

      - name: Docs typecheck, lint and build
        run: |
          cd docs && pnpm typecheck
          cd docs && pnpm lint:docs
          cd docs && pnpm build
          cd docs && pnpm exec wrangler types "${RUNNER_TEMP}/anypick-pages-env.d.ts"

      - name: Commit version and push tag
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version_files=(
            VERSION
            src/tauri/src-tauri/Cargo.toml
            src/tauri/src-tauri/Cargo.lock
            src/tauri/src-tauri/tauri.conf.json
            src/macos/AnyPick.xcodeproj/project.pbxproj
          )
          if ! git diff --quiet -- "${version_files[@]}"; then
            git add "${version_files[@]}"
            git diff --cached --check
            git commit -m "chore(release): ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "${RELEASE_TAG} already exists; reusing it."
          else
            git tag --annotate "$RELEASE_TAG" --message "AnyPick ${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      # changelogithub is fetched on demand rather than added to docs/, because
      # a new devDependency also needs a lockfile update and this tool runs once
      # per release. Pinned for reproducibility: 15.x requires Node >=22.19 and
      # this job pins 22.17.1.
      - name: Create or update the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          npx --yes changelogithub@14.0.0 --github "$GITHUB_REPOSITORY" --to "$RELEASE_TAG"

      - name: Attach the Linux desktop app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # tauri-build produces a .deb/.AppImage/.rpm under target/release/bundle.
          # Attach whatever was produced; the macos-app job adds the macOS build.
          shopt -s nullglob
          assets=(src/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
                  src/tauri/src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::the Linux desktop app produced no bundle"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Deploy the docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cd docs && pnpm run deploy

  # The macOS app can only be built on macOS. It uploads into the release the
  # job above created, so it runs after it and is allowed to fail without
  # invalidating the version commit and tag.
  macos-app:
    name: Build and attach the macOS app
    needs: release
    if: needs.release.outputs.mode != 'none'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c5ad0272d90 # v5.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: src/go/go.sum

      - name: Build unsigned universal app
        run: >-
          xcodebuild -project src/macos/AnyPick.xcodeproj -scheme AnyPick
          -configuration Release -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Verify the bundle has no Node runtime (ADR 0020)
        run: |
          app="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release/AnyPick.app' -print -quit)"
          test -n "$app"
          test -x "$app/Contents/Helpers/anypick-core"
          src/macos/scripts/check-node-free-app.sh "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" AnyPick-macos-universal.zip

      - name: Attach the macOS app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" AnyPick-macos-universal.zip --clobber

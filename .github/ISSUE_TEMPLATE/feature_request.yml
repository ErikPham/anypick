name: Feature request
description: Propose a new capability, client, or account provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow that is currently awkward or impossible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        If you are proposing a new client or account provider, state the exact
        client/source pair and the transport it would need. Support is defined
        by `TransportFor` in `src/go/internal/transport`; do not infer it from
        the client or provider registry.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
